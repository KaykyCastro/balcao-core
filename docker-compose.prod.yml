# MongoDB de produção (replica set de um nó: as vendas usam transações). Veja DEPLOY.md.
# - A porta só abre para a própria VPS (127.0.0.1): o banco NUNCA fica exposto na internet.
# - Usuário e senha vêm do .env (MONGO_ROOT_USER / MONGO_ROOT_PASSWORD), o mesmo arquivo da API.
# - mongo-keyfile: gere uma vez na VPS (DEPLOY.md, passo 3). Não vai para o git.
# Subir:  docker compose -f docker-compose.prod.yml up -d
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongo-data:
